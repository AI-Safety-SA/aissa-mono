name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  NODE_VERSION: "24"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      track_record: ${{ steps.filter.outputs.track_record }}
      website: ${{ steps.filter.outputs.website }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            track_record:
              - 'apps/track-record/**'
            website:
              - 'apps/website/**'
            shared:
              - 'packages/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  track-record-required:
    name: track-record-required
    needs: [changes]
    if: ${{ needs.changes.outputs.track_record == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared UI package
        run: pnpm build:ui

      - name: Type check track-record
        run: pnpm turbo run check-types --filter=track-record...

      - name: Lint track-record
        run: pnpm turbo run lint --filter=track-record...

      - name: Build track-record
        run: pnpm --filter track-record run build:local

      - name: Run track-record unit tests
        run: pnpm --filter track-record run test:unit

      - name: Run track-record integration tests
        run: pnpm --filter track-record run test:int

  website-required:
    name: website-required
    needs: [changes]
    if: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check website
        run: pnpm turbo run check-types --filter=website...

      - name: Lint website
        run: pnpm turbo run lint --filter=website...

      - name: Build website
        run: pnpm turbo run build --filter=website...

  track-record-e2e:
    name: track-record-e2e
    needs: [changes]
    if: ${{ needs.changes.outputs.track_record == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared UI package
        run: pnpm build:ui

      - name: Install Playwright browsers
        run: pnpm --filter track-record exec playwright install --with-deps chromium

      - name: Run track-record E2E tests
        run: pnpm --filter track-record run test:e2e

  ci-required-gate:
    name: ci-required-gate
    if: ${{ always() }}
    needs:
      - changes
      - track-record-required
      - website-required
      - track-record-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          TRACK_RECORD_CHANGED: ${{ needs.changes.outputs.track_record }}
          WEBSITE_CHANGED: ${{ needs.changes.outputs.website }}
          SHARED_CHANGED: ${{ needs.changes.outputs.shared }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TRACK_RECORD_REQUIRED_RESULT: ${{ needs.track-record-required.result }}
          WEBSITE_REQUIRED_RESULT: ${{ needs.website-required.result }}
          TRACK_RECORD_E2E_RESULT: ${{ needs.track-record-e2e.result }}
        run: |
          set -euo pipefail

          failed=0
          require_track_record=0
          require_website=0

          check_required() {
            local name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error::Required check did not pass: $name ($result)"
              failed=1
            else
              echo "Required check status: $name ($result)"
            fi
          }

          if [[ "$TRACK_RECORD_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            require_track_record=1
          fi

          if [[ "$WEBSITE_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            require_website=1
          fi

          check_required "changes" "$CHANGES_RESULT"

          if [[ "$require_track_record" -eq 1 ]]; then
            check_required "track-record-required" "$TRACK_RECORD_REQUIRED_RESULT"
            if [[ "$EVENT_NAME" == "push" ]]; then
              check_required "track-record-e2e" "$TRACK_RECORD_E2E_RESULT"
            else
              echo "PR run: track-record-e2e is informational and not merge-blocking."
            fi
          else
            echo "Track-record unchanged: skipping track-record-required and track-record-e2e gate checks."
          fi

          if [[ "$require_website" -eq 1 ]]; then
            check_required "website-required" "$WEBSITE_REQUIRED_RESULT"
          else
            echo "Website unchanged: skipping website-required gate check."
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  track-record-preview-deploy:
    name: track-record-preview-deploy
    needs:
      - changes
      - track-record-required
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main' && (needs.changes.outputs.track_record == 'true' || needs.changes.outputs.shared == 'true') && needs.track-record-required.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Deploy track-record preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TRACK_RECORD }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_REPO_OWNER: ${{ github.repository_owner }}
          GIT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" || -z "${GIT_BRANCH:-}" || -z "${GIT_COMMIT_SHA:-}" ]]; then
            echo "::error::Missing Vercel deploy configuration for track-record preview."
            exit 1
          fi

          if [[ "${GIT_BRANCH}" == "HEAD" ]]; then
            echo "::error::Resolved PR head ref is 'HEAD'; refusing to deploy to avoid preview/HEAD branch regressions."
            exit 1
          fi

          node scripts/vercel-deploy-with-redeploy-fallback.mjs --yes --target=preview --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="$GIT_BRANCH" \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubCommitOrg="$GIT_REPO_OWNER" \
            --meta githubCommitRepo="$GIT_REPO_NAME" \
            --meta githubOrg="$GIT_REPO_OWNER" \
            --meta githubRepo="$GIT_REPO_NAME"

  website-preview-deploy:
    name: website-preview-deploy
    needs:
      - changes
      - website-required
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main' && (needs.changes.outputs.website == 'true' || needs.changes.outputs.shared == 'true') && needs.website-required.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Deploy website preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_REPO_OWNER: ${{ github.repository_owner }}
          GIT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" || -z "${GIT_BRANCH:-}" || -z "${GIT_COMMIT_SHA:-}" ]]; then
            echo "::error::Missing Vercel deploy configuration for website preview."
            exit 1
          fi

          pnpm install --frozen-lockfile
          pnpm dlx vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          pnpm dlx vercel build --token="$VERCEL_TOKEN"
          pnpm dlx vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="$GIT_BRANCH" \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubCommitOrg="$GIT_REPO_OWNER" \
            --meta githubCommitRepo="$GIT_REPO_NAME" \
            --meta githubOrg="$GIT_REPO_OWNER" \
            --meta githubRepo="$GIT_REPO_NAME"

  track-record-production-deploy:
    name: track-record-production-deploy
    needs:
      - changes
      - ci-required-gate
      - track-record-required
    # `always()` is required so this job can still evaluate after the gate runs
    # through skipped unrelated app jobs.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.track_record == 'true' || needs.changes.outputs.shared == 'true') && needs['ci-required-gate'].result == 'success' && needs['track-record-required'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Deploy track-record production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TRACK_RECORD }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_REPO_OWNER: ${{ github.repository_owner }}
          GIT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" || -z "${GIT_BRANCH:-}" || -z "${GIT_COMMIT_SHA:-}" ]]; then
            echo "::error::Missing Vercel deploy configuration for track-record production."
            exit 1
          fi

          node scripts/vercel-deploy-with-redeploy-fallback.mjs --yes --prod --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="$GIT_BRANCH" \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubCommitOrg="$GIT_REPO_OWNER" \
            --meta githubCommitRepo="$GIT_REPO_NAME" \
            --meta githubOrg="$GIT_REPO_OWNER" \
            --meta githubRepo="$GIT_REPO_NAME"

  website-production-deploy:
    name: website-production-deploy
    needs:
      - changes
      - ci-required-gate
      - website-required
    # `always()` is required so this job can still evaluate after the gate runs
    # through skipped unrelated app jobs.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.website == 'true' || needs.changes.outputs.shared == 'true') && needs['ci-required-gate'].result == 'success' && needs['website-required'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Deploy website production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_REPO_OWNER: ${{ github.repository_owner }}
          GIT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" || -z "${GIT_BRANCH:-}" || -z "${GIT_COMMIT_SHA:-}" ]]; then
            echo "::error::Missing Vercel deploy configuration for website production."
            exit 1
          fi

          pnpm install --frozen-lockfile
          pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="$GIT_BRANCH" \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubCommitOrg="$GIT_REPO_OWNER" \
            --meta githubCommitRepo="$GIT_REPO_NAME" \
            --meta githubOrg="$GIT_REPO_OWNER" \
            --meta githubRepo="$GIT_REPO_NAME"
